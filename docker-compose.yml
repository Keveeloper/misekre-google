version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: misekre-postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-admin_pwd}
      POSTGRES_DB: ${DB_NAME:-misekredb}
      TZ: America/Bogota
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  calendar-api:
    build: .
    container_name: misekre-calendar-app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - DB_HOST=db
      - DB_PORT=5432
    depends_on:
      - db
    volumes:
      - ./google-tokens.json:/app/google-tokens.json
    labels:
      - traefik.enable=true
      - traefik.http.routers.calendar-api.rule=Host(`api.makru.cloud`)
      - traefik.http.routers.calendar-api.entrypoints=websecure
      - traefik.http.routers.calendar-api.tls.certresolver=letsencrypt
      - traefik.http.services.calendar-api.loadbalancer.server.port=3000

volumes:
  postgres-data:
